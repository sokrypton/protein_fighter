<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protein Fighter</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Added to a phone's home screen it opens full screen, on its side: the manifest for
     Android, the apple tags for iOS, which has no full-screen API for a page. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protein Fighter">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#000000">
<style>
  /* Two themes, switched by data-theme on <html> (game.js). Dark sits on the same black
     as py2Dmol's 3d style, light on the white of its richardson style, so the canvas
     never shows an edge. */
  :root {
    --bg: #000000; --ink: #ece9e2; --panel: #131418; --faint: #ece9e21a; --veil: #000000b3;
    --floor1: #ece9e208; --floor2: #ece9e214; --grid: #ece9e20d; --edge-far: #ece9e233; --edge-near: #ece9e299;
    --cap-edge: #ece9e299; --glow: 0 0 18px #000; --ko: #ff3b2f; --ko-glow: #7a0a05;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --ink: #1d1b18; --panel: #ffffff; --faint: #ffffff88; --veil: #ffffffcc;
    --floor1: #1d1b1808; --floor2: #1d1b1814; --grid: #1d1b180d; --edge-far: #1d1b1840; --edge-near: #1d1b18;
    --cap-edge: #1d1b18; --glow: none; --ko: #c8102e; --ko-glow: #ffb3a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--ink);
         font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* Everything around the stage is sized from the screen: --u is a unit that grows with
     the viewport, kept within reason on a phone and on a big monitor. */
  .arena { position: relative; width: 100%; height: 100%;
           --u: clamp(0.62px, 0.09vmin, 1.15px);
           --side: max(env(safe-area-inset-left), env(safe-area-inset-right), 24px);
           --foot: max(env(safe-area-inset-bottom), 12px); }
  #stage { position: absolute; inset: 0; pointer-events: none; }
  /* The camera looks down a little, so the floor is a band, not a line: its far edge
     sits above the feet line and its near edge below, and a foot nearer the camera
     lands lower in it. */
  /* The band reaches well back behind the feet, so a back foot always stands on floor.
     game.js sets --floor-far and --floor-depth from the camera every frame. */
  /* The cell: drawn by cell.js behind everything, to the same camera as the fight. */
  #cell { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }   /* sparks and ripples, over the proteins */
  .floor { position: absolute; left: 0; right: 0; top: var(--floor-far, calc(70% - 10vh)); bottom: 0; pointer-events: none;
           background: linear-gradient(var(--floor1), var(--floor2) var(--floor-depth, 17vh), #0000 var(--floor-depth, 17vh)),
                       repeating-linear-gradient(90deg, var(--grid) 0 2px, #0000 2px var(--grid-step, 40px));
           background-position: 0 0, var(--grid-x, 0) 0; }
  .floor::before { content: ''; position: absolute; left: 0; right: 0; top: 0; border-top: 1px solid var(--edge-far); }
  .floor::after { content: ''; position: absolute; left: 0; right: 0; top: var(--floor-depth, 17vh); border-top: 2px solid var(--edge-near); }

  .hud { position: absolute; top: max(env(safe-area-inset-top), 12px); left: var(--side); right: var(--side);
         display: flex; gap: clamp(10px, 3vw, 24px); align-items: start; z-index: 2; }
  .player { flex: 1; min-width: 0; }
  .player b { font-size: calc(26 * var(--u)); font-style: italic; letter-spacing: -0.5px; text-shadow: var(--glow); }
  .player small { display: block; font-size: max(10px, calc(11 * var(--u))); letter-spacing: 1px; opacity: 0.85; margin-top: 4px; white-space: nowrap; text-shadow: var(--glow); }
  /* Health is the average pLDDT; game.js colours the fill with the AlphaFold band. */
  .bar { height: calc(16 * var(--u)); border: 2px solid var(--ink); margin-top: 6px; transform: skewX(-14deg); background: var(--faint); }
  .bar i { display: block; height: 100%; width: 100%; background: #0d57d3; transition: width 0.12s, background-color 0.3s; }
  .p2 { text-align: right; }
  .p2 .bar i { margin-left: auto; }
  /* The special meter: fills as the heat shock / helix spin comes back, lit when ready */
  .meter { height: calc(5 * var(--u)); border: 1px solid var(--ink); margin-top: 4px; transform: skewX(-14deg); background: var(--faint); opacity: 0.8; }
  .meter i { display: block; height: 100%; width: 0; background: #fed936; transition: width 0.1s; }
  .meter.ready i { background: #fd7d4d; box-shadow: 0 0 6px #fd7d4d; }
  .p2 .meter i { margin-left: auto; }
  /* PAE maps under the health bars (drawn by game.js). */
  .pae { margin-top: 10px; display: grid; gap: 3px; justify-items: start; }
  .p2 .pae { justify-items: end; }
  .pae canvas { width: clamp(56px, 13vmin, 120px); height: clamp(56px, 13vmin, 120px); image-rendering: pixelated; border: 1px solid var(--edge-far); }
  .pae small { font-size: 9px; line-height: 1.3; opacity: 0.6; max-width: 180px; margin: 0; }
  .timer { text-align: center; font-size: calc(40 * var(--u)); line-height: 1; min-width: calc(70 * var(--u)); text-shadow: var(--glow); }
  .timer small { display: block; font-size: max(9px, calc(10 * var(--u))); margin-top: 6px; letter-spacing: 1px; white-space: nowrap; }

  #impact { position: absolute; top: 34%; transform: translateX(-50%); font-size: calc(30 * var(--u)); font-weight: 900; font-style: italic;
            color: var(--ink); text-shadow: var(--glow); opacity: 0; pointer-events: none; z-index: 3; white-space: nowrap; }
  #impact.pop { animation: pop 0.45s ease-out; }
  /* Damage numbers and the combo count float up from the impact and fade. */
  #nums { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  #nums .num { position: absolute; transform: translate(-50%, -50%); font-size: calc(15 * var(--u)); font-weight: 900; font-style: italic;
               color: var(--ink); text-shadow: var(--glow); white-space: nowrap; animation: rise 0.9s ease-out forwards; }
  #nums .combo { font-size: calc(19 * var(--u)); color: var(--ko); animation-duration: 1.1s; }
  @keyframes rise { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
  /* The finisher: DENATURED slams in letter by letter over the knockout, the arena shaking. */
  #finish { position: absolute; left: 0; right: 0; top: 30%; text-align: center; z-index: 3; pointer-events: none;
            font-size: clamp(34px, 9vw, 110px); font-weight: 900; font-style: italic; letter-spacing: 0.04em; line-height: 1;
            color: var(--ko); text-shadow: 0 0 0.25em var(--ko-glow), 0 0.04em 0 #000; }
  #finish[hidden] { display: none; }
  #finish span { display: inline-block; opacity: 0; animation: slam 0.32s cubic-bezier(0.2, 1.4, 0.3, 1) forwards; }
  @keyframes slam { 0% { opacity: 0; transform: scale(3.5) translateY(-0.3em); filter: blur(4px); } 60% { opacity: 1; transform: scale(0.92); filter: blur(0); } 100% { opacity: 1; transform: scale(1); } }
  #finish.settle { animation: throb 1.2s ease-in-out infinite alternate; }
  @keyframes throb { from { transform: scale(1); } to { transform: scale(1.04); } }
  .arena.shake { animation: shake 0.5s linear; }
  @keyframes shake { 0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-9px, 5px); } 20% { transform: translate(8px, -6px); }
                     30% { transform: translate(-7px, -4px); } 40% { transform: translate(6px, 5px); } 50% { transform: translate(-5px, 3px); }
                     60% { transform: translate(4px, -3px); } 70% { transform: translate(-3px, 2px); } 80% { transform: translate(2px, -1px); } 90% { transform: translate(-1px, 1px); } }
  @keyframes pop { 0% { opacity: 1; transform: translateX(-50%) scale(1.5); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(1); } }

  /* Over everything, the pad included, so a button on it (REFOLD, RESUME) cannot be under a
     touch key; and itself no target, so where it shows nothing a tap reaches what is below. */
  #overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px;
             background: var(--veil); z-index: 7; padding-inline: 16px; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  #overlay[hidden] { display: none; }
  #overlay.ended { background: transparent; }   /* round over: nothing hides the settling heap */
  #overlay h1 { margin: 0; font-size: clamp(32px, 7vw, 72px); font-style: italic; letter-spacing: -2px; }
  #overlay p { margin: 0; }
  #overlay #msg { max-width: min(90vw, 520px); word-break: break-all; font-size: 12px; opacity: 0.8; }
  /* The join code for remote play: scan it with the other device. */
  #qr { display: grid; place-items: center; margin-top: 6px; }
  #qr[hidden] { display: none; }
  #qr img { image-rendering: pixelated; border: 8px solid #fff; background: #fff; }
  /* The join link as text: click it or COPY to put it on the clipboard. */
  #joinbox { display: flex; gap: 0; margin-top: 10px; width: min(92vw, 560px); }
  #joinbox[hidden] { display: none; }
  #joinlink { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 8px 10px; color: var(--ink); background: var(--faint);
              border: 2px solid var(--ink); border-right: 0; cursor: pointer; }
  #copylink { padding: 8px 14px; font-size: 11px; letter-spacing: 1px; min-width: 84px; }
  /* The menu sits over the fight without a veil, so the fighters show as they warm up. */
  #overlay:has(#modes:not([hidden])) { background: transparent; }
  #modes[hidden] { display: none; }
  /* The settings under START: a narrow column, to fit between the fighters, each setting
     its name over a pill of choices, the chosen one filled in. */
  .setup { display: flex; flex-direction: column; align-items: center; gap: 9px; margin: 12px auto 0; padding: 12px 16px;
           background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .opt[hidden] { display: none; }
  .opt small { font-size: 10px; letter-spacing: 1px; opacity: 0.7; }
  .pill { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .pill button { background: transparent; color: var(--ink); border: 0; padding: 5px 12px; font-size: 11px; letter-spacing: 1px; white-space: nowrap; }
  .pill button.on { background: var(--ink); color: var(--bg); }
  .pill button:not(.on):hover { background: var(--faint); }
  .pill button:focus:not(:focus-visible) { outline: none; }
  /* The switches over the fighters' heads. */
  .picks[hidden] { display: none; }
  .pick { position: absolute; transform: translate(-50%, -100%); display: grid; justify-items: center; gap: 3px; padding-bottom: 8px;
          white-space: nowrap; text-shadow: var(--glow); }
  /* Where the switches go: under the feet, where they stay put through the warm-up, or on
     a phone on its side beside the shoulders, the pad having the floor. game.js sets
     data-at to match. */
  .picks[data-at="side"] .pick[data-player="0"] { transform: translate(-100%, -50%); justify-items: end; padding: 0 10px 0 0; }
  .picks[data-at="side"] .pick[data-player="1"] { transform: translate(0, -50%); justify-items: start; padding: 0 0 0 10px; }
  .picks[data-at="under"] .pick { transform: translate(-50%, 0); padding: 6px 0 0; }
  .pick[hidden] { display: none; }
  .pick .pill { background: var(--panel); text-shadow: none; }

  #theme { position: absolute; z-index: 6; left: var(--side); bottom: var(--foot); width: 26px; height: 26px; padding: 0; border-radius: 50%;
           border: 2px solid var(--cap-edge); background: var(--panel); color: var(--ink); font-size: 14px; line-height: 1; display: grid; place-content: center; }
  #theme:focus:not(:focus-visible) { outline: none; }
  /* Full screen, bottom right, where the browser allows it (game.js hides it otherwise). */
  #full { position: absolute; z-index: 6; right: var(--side); bottom: var(--foot); width: 26px; height: 26px; padding: 0; border-radius: 50%;
          border: 2px solid var(--cap-edge); background: var(--panel); color: var(--ink); font-size: 13px; line-height: 1; display: grid; place-content: center; }
  #full[hidden] { display: none; }
  #full:focus:not(:focus-visible) { outline: none; }
  button { font: inherit; cursor: pointer; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); padding: 10px 22px; letter-spacing: 1px; }
  button:disabled { opacity: 0.5; cursor: wait; }
  kbd { border: 1px solid var(--ink); padding: 0 4px; }

  /* Controls: P1 on the left of the keyboard, P2 on the right. */
  /* The pad's box spans the screen on a phone: only its keys are targets, so a tap between
     them, or on a button of the overlay that the box happens to cover, goes through. */
  .pad { position: absolute; bottom: calc(var(--foot) + 34px); z-index: 5; display: grid; gap: 5px; font-size: 10px; letter-spacing: 0.5px; pointer-events: none; }
  .pad .cap { pointer-events: auto; }
  .pad[hidden] { display: none; }
  .pad .who { font-size: 12px; font-style: italic; }
  .pad .row { display: flex; gap: 10px; align-items: end; }
  /* Pause and sound, a line in the corner beside the theme button. */
  .foot { position: absolute; left: calc(var(--side) + 34px); bottom: calc(var(--foot) + 6px); z-index: 5; margin: 0; font-size: 10px; letter-spacing: 0.5px; opacity: 0.6; }
  .left { left: var(--side); justify-items: start; }
  .right { right: var(--side); justify-items: end; text-align: right; }
  .dirs { display: grid; grid-template-areas: ". u ." "l d r"; gap: 4px; }
  .hits { display: flex; gap: 4px; }
  .cap { width: 46px; height: 42px; padding: 0; display: grid; place-content: center; gap: 1px; letter-spacing: 0;
         background: var(--panel); color: var(--ink); border: 2px solid var(--cap-edge); border-bottom-width: 4px; border-radius: 4px;
         touch-action: none; user-select: none; -webkit-user-select: none; }
  .cap b { font-size: 15px; line-height: 1; }
  .cap small { font-size: 8px; text-transform: uppercase; opacity: 0.6; }
  .cap.down { background: var(--ink); color: var(--bg); border-color: var(--ink); border-bottom-width: 2px; transform: translateY(2px); }
  .link { background: none; color: inherit; border: 0; padding: 0; font-size: 10px; letter-spacing: 0.5px; text-decoration: underline; }
  .link:focus:not(:focus-visible) { outline: none; }
  .netstat { display: block; text-align: center; font-size: 10px; letter-spacing: 0.5px; opacity: 0.6; white-space: nowrap; }
  .netstat:empty { display: none; }
  /* The footnote: the credit, centred at the bottom between the two pads, where there is room. */
  .footnote { position: absolute; left: max(18%, 350px); right: max(18%, 350px); bottom: calc(var(--foot) - 2px); z-index: 5; text-align: center;
              pointer-events: none; font-size: 11px; line-height: 1.6; opacity: 0.55; }
  .footnote .credit { letter-spacing: 0.5px; margin-top: 2px; }
  @media (pointer: coarse) {
    .cap { width: 56px; height: 52px; }
    .cap b { font-size: 17px; }
    .foot { display: none; }
  }
  /* One player on a touch screen, or any phone-sized screen: the pad spans the bottom,
     the four directions under the left thumb and the three strikes under the right. */
  @media (pointer: coarse), (max-width: 640px), (max-height: 520px) {
    body:has(#p2pad[hidden]) .pad.left { right: var(--side); justify-items: stretch; }
    body:has(#p2pad[hidden]) .pad.left .row { flex-direction: row; justify-content: space-between; align-items: end; width: 100%; }
    body:has(#p2pad[hidden]) .pad.left .who { justify-self: start; }
  }
  /* Any protein as P2: a small card over the page. */
  #custom-modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--veil); padding: 16px; }
  #custom-modal[hidden] { display: none; }
  .modal-card { background: var(--panel); color: var(--ink); border: 2px solid var(--ink); border-radius: 12px; padding: 14px 16px; max-width: 560px; width: 100%; display: grid; gap: 10px; text-align: left; }
  .modal-card.dragover { background: var(--faint); }   /* the whole card takes a dropped file */
  /* A file over the page, anywhere: the page says it will take it. */
  body.dragover::after { content: 'drop the structure anywhere'; position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: var(--veil); color: var(--ink); font-size: 16px; letter-spacing: 3px; border: 4px dashed var(--ink); box-sizing: border-box; pointer-events: none; }
  .fetch-row { display: flex; gap: 6px; }
  .fetch-row input { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 2px solid var(--ink); border-radius: 6px; }
  .fetch-row button { padding: 8px 12px; font-size: 11px; border-radius: 6px; white-space: nowrap; }
  .preset-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1px; opacity: 0.9; }
  .preset-row span { opacity: 0.6; }
  .preset-btn { padding: 4px 9px; font-size: 10px; background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 999px; letter-spacing: 1px; }
  .preset-btn:hover { background: var(--faint); }
  #custom-status { font-size: 11px; line-height: 1.5; }
  #custom-status[hidden] { display: none; }
  /* The fighter as it will stand, to turn by hand before the fight. */
  #custom-preview { width: 100%; height: min(520px, 62vh); border-radius: 8px; overflow: hidden; touch-action: none; cursor: grab; }
  #custom-preview[hidden] { display: none; }
  #custom-preview canvas { width: 100% !important; height: 100% !important; }
  /* Once a structure is in: FIGHT, in the AlphaFold blue, on the same row, and nothing
     else (a click on the veil or Escape leaves the card). */
  #btn-load-custom { background: #0d57d3; color: #fff; border-color: #0d57d3; letter-spacing: 2px; }
  #btn-load-custom:hover { background: #1a66e6; }
  #btn-load-custom[hidden] { display: none; }
  /* The line about the fighter sits on the preview, not under it. */
  .preview-box { position: relative; }
  .preview-box[hidden] { display: none; }
  #custom-status { position: absolute; left: 8px; bottom: 6px; pointer-events: none; }
  /* No preview to sit on (a file that could not be read): the line takes its own row. */
  .preview-box:has(#custom-preview[hidden]) #custom-status { position: static; padding: 4px 0; }
  @media (max-width: 760px), (max-height: 520px) { .footnote { display: none; } }
  /* A phone upright: the fighters fill the width, so the menu takes the room over their
     heads, under the health bars, and their names go under their feet. */
  @media (max-width: 640px) and (orientation: portrait) {
    #overlay:has(#modes:not([hidden])) { align-content: start; padding-top: calc(max(env(safe-area-inset-top), 12px) + 138px); }
    #one { padding: 8px 18px; }
    .setup { gap: 6px; padding: 10px 14px; margin-top: 8px; }
    .pill button { padding: 3px 9px; }
  }
  @media (max-width: 640px) {
    .arena { --side: max(env(safe-area-inset-left), env(safe-area-inset-right), 8px); }
    .foot { display: none; }
    .pae small { display: none; }
    .hud { gap: 8px; }
    .player small { white-space: normal; }
    .timer { min-width: 0; }
  }
  /* A short screen (a phone on its side): the menu is a tighter column between the
     fighters, above the pad, which stays on show. */
  @media (max-height: 520px) {
    .pae { display: none; }
    .pill button { padding: 3px 9px; }
    #one { padding: 6px 16px; }
    .setup { gap: 5px; padding: 8px 12px; margin-top: 6px; }
    .pad { bottom: calc(var(--foot) + 20px); }
    .foot { bottom: calc(var(--foot) + 4px); }
    #theme, #full { bottom: 2px; width: 22px; height: 22px; font-size: 12px; }
  }
  /* On a touch screen, or any phone-sized one, the game is one player or remote: two on
     one phone is no game. */
  @media (pointer: coarse), (max-width: 640px), (max-height: 520px) { [data-players="2"] { display: none; } }
</style>
</head>
<body>
<main class="arena">
  <canvas id="cell" aria-hidden="true"></canvas>
  <div class="floor"></div>
  <div id="stage"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="hud">
    <div class="player"><b id="name0">P1</b><small><span id="fold0">pLDDT 100</span> · <span id="wins0">○ ○</span></small><div class="bar"><i id="hp0"></i></div>
      <div class="meter" id="meter0" title="special: punch + kick together"><i id="sp0"></i></div>
      <div class="pae"><canvas id="pae0" width="91" height="91" aria-label="P1 predicted aligned error map"></canvas></div></div>
    <div class="timer"><span id="timer">99</span><small id="round">ROUND 01</small><small id="netstat" class="netstat"></small></div>
    <div class="player p2"><b id="name1">P2</b><small><span id="wins1">○ ○</span> · <span id="fold1">pLDDT 100</span></small><div class="bar"><i id="hp1"></i></div>
      <div class="meter" id="meter1" title="special: punch + kick together"><i id="sp1"></i></div>
      <div class="pae"><canvas id="pae1" width="91" height="91" aria-label="P2 predicted aligned error map"></canvas></div></div>
  </div>

  <div id="impact"></div>
  <div id="nums" aria-hidden="true"></div>
  <div id="finish" hidden aria-live="polite"></div>

  <div id="overlay" class="ended">
    <h1 id="title" hidden></h1>
    <p id="msg" hidden></p>
    <div id="modes"><button id="one" disabled>START</button>
      <!-- The settings, a narrow column between the fighters: a name over each choice. -->
      <div class="setup">
        <span class="opt players" role="group" aria-label="Players"><small>PLAYERS</small><span class="pill"><button data-players="1" tabindex="-1" class="on">1 PLAYER</button><button data-players="2" tabindex="-1">2 PLAYERS</button><button data-players="3" tabindex="-1">REMOTE</button></span></span>
        <span class="opt levels" role="group" aria-label="CPU difficulty"><small>CPU</small><span class="pill"><button data-level="easy" tabindex="-1">EASY</button><button data-level="normal" tabindex="-1" class="on">NORMAL</button><button data-level="hard" tabindex="-1">HARD</button></span></span>
        <span class="opt look" role="group" aria-label="Protein colouring"><small>COLOUR</small><span class="pill"><button data-colour-choice="plddt" tabindex="-1" aria-pressed="true" class="on">pLDDT</button><button data-colour-choice="rainbow" tabindex="-1" aria-pressed="false">RAINBOW</button><button data-colour-choice="ss" tabindex="-1" aria-pressed="false">SSE</button></span></span>
      </div>
    </div>
    <!-- The character select: over each fighter's head, the switch between the two
         proteins; the fighter below swaps as you choose. game.js places them. -->
    <div class="picks">
      <div class="pick" data-player="0" role="group" aria-label="P1 protein"><span class="pill"><button data-pick="0:barrel" tabindex="-1" class="on">BARREL</button><button data-pick="0:helix" tabindex="-1">BUNDLE</button><button data-pick="0:custom0" id="pick-custom-0" tabindex="-1">CUSTOM</button></span></div>
      <div class="pick" data-player="1" role="group" aria-label="P2 protein"><span class="pill"><button data-pick="1:barrel" tabindex="-1">BARREL</button><button data-pick="1:helix" tabindex="-1" class="on">BUNDLE</button><button data-pick="1:custom1" id="pick-custom-1" tabindex="-1">CUSTOM</button></span></div>
    </div>
    <div id="qr" hidden></div>
    <div id="joinbox" hidden><input id="joinlink" readonly spellcheck="false" aria-label="Join link"><button id="copylink" type="button">COPY</button></div>
    <p><button id="go" hidden>FIGHT</button></p>
  </div>

  <!-- Dark or light, in the corner: the moon or sun shows the theme it is on. -->
  <button id="theme" tabindex="-1" aria-label="Switch to the light theme" title="light theme">☾</button>
  <button id="full" tabindex="-1" aria-label="Full screen" title="full screen" hidden>⛶</button>

  <!-- Any protein as P2: an AlphaFold DB accession, or a file. game.js reads and rigs it. -->
  <div id="custom-modal" hidden>
    <div class="modal-card" id="drop-zone">
      <div class="fetch-row">
        <input id="uniprot-input" placeholder="1UBQ, P69905, or drop a file" spellcheck="false" autocomplete="off" aria-label="PDB id or UniProt accession">
        <button type="button" id="btn-fetch-af">FETCH</button>
        <button type="button" id="btn-browse">UPLOAD</button>
        <button type="button" id="btn-load-custom" hidden>FIGHT</button>
        <input type="file" id="file-input" accept=".pdb,.ent,.cif,.mmcif,.mcif" style="display:none">
      </div>
      <div class="preset-row">
        <button type="button" class="preset-btn" data-preset="gfp">GFP</button>
        <button type="button" class="preset-btn" data-preset="hba">HEMOGLOBIN</button>
        <button type="button" class="preset-btn" data-preset="insulin">INSULIN</button>
        <button type="button" class="preset-btn" data-preset="ubq">UBIQUITIN</button>
      </div>
      <div class="preview-box">
        <div id="custom-preview" hidden aria-label="The fighter as it will stand; drag to turn it"></div>
        <div id="custom-status" hidden></div>
      </div>
    </div>
  </div>
  </div>

  <div class="pad left">
    <b class="who">P1</b>
    <div class="row">
      <div class="dirs">
        <button class="cap" data-key="w" tabindex="-1" style="grid-area: u"><b>W</b><small>jump</small></button>
        <button class="cap" data-key="a" tabindex="-1" style="grid-area: l"><b>A</b><small>left</small></button>
        <button class="cap" data-key="s" tabindex="-1" style="grid-area: d"><b>S</b><small>crouch</small></button>
        <button class="cap" data-key="d" tabindex="-1" style="grid-area: r"><b>D</b><small>right</small></button>
      </div>
      <div class="hits">
        <button class="cap" data-key="f" tabindex="-1"><b>F</b><small>punch</small></button>
        <button class="cap" data-key="g" tabindex="-1"><b>G</b><small>kick</small></button>
        <button class="cap" data-key="h" tabindex="-1"><b>H</b><small>block</small></button>
      </div>
    </div>
  </div>
  <p class="foot"><kbd>Esc</kbd> pause ·
    <button class="link" id="sound" tabindex="-1">SOUND ON</button></p>

  <!-- P2's keys, shown only in a two-player game -->
  <div class="pad right" id="p2pad" hidden>
    <b class="who">P2</b>
    <div class="row">
      <div class="hits">
        <button class="cap" data-key="." tabindex="-1"><b>.</b><small>punch</small></button>
        <button class="cap" data-key="/" tabindex="-1"><b>/</b><small>kick</small></button>
        <button class="cap" data-key="," tabindex="-1"><b>,</b><small>block</small></button>
      </div>
      <div class="dirs">
        <button class="cap" data-key="arrowup" tabindex="-1" style="grid-area: u"><b>↑</b><small>jump</small></button>
        <button class="cap" data-key="arrowleft" tabindex="-1" style="grid-area: l"><b>←</b><small>left</small></button>
        <button class="cap" data-key="arrowdown" tabindex="-1" style="grid-area: d"><b>↓</b><small>crouch</small></button>
        <button class="cap" data-key="arrowright" tabindex="-1" style="grid-area: r"><b>→</b><small>right</small></button>
      </div>
    </div>
  </div>

  <div class="footnote">
    <div class="credit">characters inspired by Hannes Stark and Alex Waldherr</div>
  </div>
</main>

<script src="vendor/py2Dmol.embed.min.js"></script>
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="net.js"></script>
<script src="cell.js"></script>
<script src="rig_data.js"></script>
<script src="rig_data_helix.js"></script>
<script src="rig.js"></script>
<script src="motion.js"></script>
<script src="lddt.js"></script>
<script src="custom_pdb.js"></script>
<script src="game.js"></script>
</body>
</html>
